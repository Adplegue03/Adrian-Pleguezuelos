<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLUBS XI · Copa de Europa histórica</title>
<meta name="description" content="Sortea campeones de Europa de 1956 a 2026, arma tu once de leyenda y conquista la Copa. ¿Harás el 7 a 0?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060b1f;--bg2:#0b1433;--card:#101b42;--card2:#16245a;--line:#24357a;
  --tx:#eef2ff;--mut:#9aa6d1;--acc:#4fd6ff;--acc2:#7c5cff;--gold:#f3c95b;--ok:#3ee08f;--warn:#ffb648;--bad:#ff5d6c;
  --pitch1:#13552f;--pitch2:#176236;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif;font-size:15px;min-height:100%}
body{background:
  radial-gradient(1200px 600px at 50% -200px,#1b2c74 0%,transparent 60%),
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.05) 1px,transparent 1.5px) 0 0/90px 90px,
  radial-gradient(circle at 70% 80%,rgba(255,255,255,.04) 1px,transparent 1.5px) 0 0/130px 130px,
  var(--bg);background-attachment:fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.disp{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.02em}
#app{max-width:1080px;margin:0 auto;padding:12px 12px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:22px;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.logo b{color:var(--acc)}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;background:var(--card2);border:1px solid var(--line);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#051026}
.btn.gold{background:linear-gradient(135deg,#ffe08a,#e2a93a);border:0;color:#2a1a00}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.big{padding:16px 22px;font-size:18px;width:100%}
.card{background:linear-gradient(180deg,var(--card),#0d1738);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.mut{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grid2{display:grid;gap:14px}
@media(min-width:860px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
h1,h2,h3{margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-weight:600;font-size:13px}
.chip.on{background:var(--acc);color:#04122a;border-color:var(--acc)}
.sec-t{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}

/* HOME */
.hero{text-align:center;padding:26px 8px 8px}
.hero .t{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(56px,15vw,96px);line-height:.9;letter-spacing:.02em;background:linear-gradient(180deg,#fff 30%,#a9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .t b{background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text}
.hero .s{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:18px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin-top:8px}
.hero .q{font-size:17px;margin:14px auto 0;max-width:520px;line-height:1.4}
.trophy{font-size:54px;filter:drop-shadow(0 6px 24px rgba(243,201,91,.45))}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px}
.stat span{font-size:12px;color:var(--mut)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.optb{padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-weight:700;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:17px;text-align:center}
.optb.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset;color:var(--acc)}
.styleg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stb{text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2)}
.stb b{display:block;font-size:15px}
.stb span{font-size:12px;color:var(--mut);line-height:1.3;display:block;margin-top:3px}
.stb.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.sw{width:46px;height:26px;border-radius:99px;background:#2a3870;position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}.sw.on:after{left:23px}

/* PITCH */
.pitch{position:relative;width:100%;aspect-ratio:68/88;border-radius:16px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch1) 0 9%,var(--pitch2) 9% 18%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.35)}
.pitch:before{content:"";position:absolute;inset:4%;border:2px solid rgba(255,255,255,.22);border-radius:4px;
  background:
  radial-gradient(circle at 50% 50%,transparent 13.5%,rgba(255,255,255,.22) 13.6%,rgba(255,255,255,.22) 14.2%,transparent 14.3%),
  linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22)) 0 50%/100% 2px no-repeat}
.pitch:after{content:"";position:absolute;left:28%;right:28%;bottom:4%;height:14%;border:2px solid rgba(255,255,255,.22);border-bottom:0}
.pitch .box-top{position:absolute;left:28%;right:28%;top:4%;height:14%;border:2px solid rgba(255,255,255,.22);border-top:0}
.slot{position:absolute;transform:translate(-50%,-50%);width:21%;max-width:96px;display:flex;flex-direction:column;align-items:center;z-index:2}
.slot .e{width:46px;height:46px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);display:grid;place-items:center;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:14px;background:rgba(0,0,0,.18)}
.slot.hl .e{border:2px solid var(--gold);background:rgba(243,201,91,.25);animation:pulse 1s infinite;cursor:pointer}
.slot.hl.oop .e{border-color:var(--warn)}
@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 18px var(--gold)}}
.pc{width:100%;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.pc .sh{width:44px;height:44px;border-radius:12px 12px 16px 16px;display:grid;place-items:center;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:20px;position:relative;border:2px solid rgba(255,255,255,.8)}
.pc .pos{position:absolute;top:-8px;left:-10px;font-size:10px;background:#0a1230;color:#fff;border-radius:6px;padding:1px 4px;font-family:Barlow;font-weight:700}
.pc .pen{position:absolute;top:-8px;right:-12px;font-size:10px;background:var(--warn);color:#2a1800;border-radius:6px;padding:1px 4px;font-weight:800;font-family:Barlow}
.pc .nm{margin-top:4px;background:rgba(5,10,30,.85);border-radius:6px;padding:2px 6px;font-weight:700;font-size:11.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ed{font-size:9.5px;color:#cfe;opacity:.85;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.slot.new .pc{animation:pop .45s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.mini .slot .e{width:30px;height:30px;font-size:11px}
.mini .pc .sh{width:30px;height:30px;font-size:14px;border-radius:9px}
.mini .pc .nm{font-size:10px;padding:1px 4px}
.mini .pc .pos,.mini .pc .ed{display:none}

/* rating colors */
.rt{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800}
.r95{color:#ffe7a3}.r90{color:var(--gold)}.r85{color:var(--acc)}.r80{color:var(--ok)}.r75{color:#d6e36b}.r70{color:#bbb}
.bg95{background:linear-gradient(135deg,#fff3c4,#e6b53c);color:#2c1d00}
.bg90{background:linear-gradient(135deg,#f6d77a,#c9952c);color:#2c1d00}
.bg85{background:linear-gradient(135deg,#8fe9ff,#2ea6d6);color:#03203a}
.bg80{background:linear-gradient(135deg,#8ff0bd,#2cb673);color:#022a16}
.bg75{background:linear-gradient(135deg,#e7ef9a,#a9b83a);color:#262b00}
.bg70{background:linear-gradient(135deg,#d5d9e6,#8c93ab);color:#151a2a}
.bgq{background:linear-gradient(135deg,#3b4a8a,#27336a);color:#fff}

/* DRAFT */
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hud .chip b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:16px}
.draw-card{position:relative;overflow:hidden;padding:0}
.ed-head{padding:14px 14px 12px;display:flex;gap:12px;align-items:center;position:relative}
.crest{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:16px;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.crest.sm{width:34px;height:34px;font-size:11px}
.crest.xs{width:22px;height:22px;font-size:8px;border-width:1.5px}
.ed-head h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;line-height:1}
.ed-head .y{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;color:var(--gold);font-size:17px}
.ed-meta{font-size:12.5px;color:var(--mut);margin-top:3px}
.stripe{height:5px}
.plist{max-height:none}
.prow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid rgba(255,255,255,.06);cursor:pointer;transition:background .12s}
.prow:hover{background:rgba(79,214,255,.06)}
.prow .pb{width:40px;text-align:center;font-size:11px;font-weight:800;border-radius:6px;padding:3px 0;background:#1e2b63;flex:none}
.prow .n{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .tag{font-size:11px;color:var(--mut)}
.prow .rt{font-size:22px;width:34px;text-align:right}
.prow.dis{opacity:.35;cursor:not-allowed}
.prow.sel{background:rgba(243,201,91,.14);box-shadow:inset 3px 0 0 var(--gold)}
.dice-zone{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 14px;text-align:center}
.dice{font-size:64px;line-height:1;transition:transform .3s}
.dice.roll{animation:roll .5s linear infinite}
@keyframes roll{to{transform:rotate(360deg)}}
.roller{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px;font-weight:800;min-height:34px}
.banner{padding:10px 14px;border-radius:12px;background:rgba(255,182,72,.12);border:1px solid rgba(255,182,72,.35);font-size:13.5px}
.hint{padding:10px 14px;font-size:13.5px;background:rgba(243,201,91,.1);border-top:1px solid rgba(243,201,91,.3);color:#ffe7a3}
@media(min-width:860px){.sticky{position:sticky;top:8px;align-self:start}}
@media(max-width:859px){.draft .dpanel{order:-1}.draft .pitch{max-width:440px;margin:0 auto}}

/* BARS */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:86px 1fr 40px;align-items:center;gap:8px;font-size:13px}
.bar i{display:block;height:9px;border-radius:9px;background:#1b2760;overflow:hidden}
.bar i u{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:9px}
.bar b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:18px;text-align:right}
.ovr-big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:60px;line-height:1}

/* HUB */
.path{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 14px}
.path div{text-align:center;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:13px;padding:8px 0;border-radius:10px;background:var(--bg2);border:1px solid var(--line);color:var(--mut)}
.path .done{background:rgba(62,224,143,.15);border-color:rgba(62,224,143,.5);color:var(--ok)}
.path .lost{background:rgba(255,93,108,.15);border-color:rgba(255,93,108,.5);color:var(--bad)}
.path .drw{background:rgba(255,182,72,.14);border-color:rgba(255,182,72,.5);color:var(--warn)}
.path .cur{background:var(--acc);color:#04122a;border-color:var(--acc)}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{font-weight:600;color:var(--mut);font-size:11.5px;text-align:center;padding:6px 3px}
.tb td{text-align:center;padding:8px 3px;border-top:1px solid rgba(255,255,255,.06)}
.tb td.l,.tb th.l{text-align:left}
.tb tr.me td{background:rgba(79,214,255,.1);font-weight:700}
.tb tr.q td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.vs{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vs .side{flex:1;text-align:center;min-width:0}
.vs .side .nm{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:20px;line-height:1.05;margin-top:6px}
.vs .side .o{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:30px;font-weight:800}
.vs .x{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;color:var(--mut);font-size:22px}
.res-l{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.res-l .st{width:34px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;color:var(--mut)}
.res-l .sc{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:18px;width:64px;text-align:center}
.res-l .w{color:var(--ok)}.res-l .d{color:var(--warn)}.res-l .lo{color:var(--bad)}

/* MATCH */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:16px 10px 10px}
.score .tm{text-align:center;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(16px,4.4vw,22px);line-height:1.05}
.score .num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(50px,14vw,72px);line-height:1;display:flex;gap:12px;align-items:center}
.score .num span{min-width:.6em;text-align:center;display:inline-block}
.score .num .flash{animation:flash 1s}
@keyframes flash{0%{color:var(--gold);transform:scale(1.6)}100%{transform:scale(1)}}
.clock{text-align:center;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:18px;color:var(--acc)}
.prog{height:5px;background:#1b2760;border-radius:5px;overflow:hidden;margin:8px 0 0}
.prog u{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .2s}
.speed{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.speed button{padding:8px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-weight:700;font-size:13px}
.speed button.on{background:var(--acc);color:#04122a;border-color:var(--acc)}
.speed button.super{background:linear-gradient(135deg,#ff5d6c,#ff9a3c);border:0;color:#fff;letter-spacing:.06em}
.feed{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;padding-right:4px}
.ev{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:11px;background:var(--bg2);border:1px solid rgba(255,255,255,.05);font-size:14px;animation:slide .3s}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}}
.ev .m{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;color:var(--mut);width:30px;flex:none}
.ev.goal{background:linear-gradient(90deg,rgba(243,201,91,.25),rgba(243,201,91,.06));border-color:rgba(243,201,91,.5)}
.ev.goal.opp{background:linear-gradient(90deg,rgba(255,93,108,.22),rgba(255,93,108,.05));border-color:rgba(255,93,108,.45)}
.ev.big{font-weight:700;justify-content:center;text-align:center;background:rgba(79,214,255,.08);border-color:rgba(79,214,255,.3)}
.ev .who{font-size:11px;font-weight:700;margin-right:4px;padding:1px 6px;border-radius:5px}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;color:var(--mut);padding:0 10px 4px}
.scorers div:last-child{text-align:right}
.stt{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.stt b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:18px;text-align:center}
.stt .bb{display:flex;height:7px;border-radius:7px;overflow:hidden;background:#1b2760}
.stt .bb u{background:var(--acc)}.stt .bb s{background:var(--bad);text-decoration:none}
.stt .lb{grid-column:1/-1;text-align:center;color:var(--mut);font-size:11.5px;margin-bottom:-6px}
.prat{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13.5px}
.prat .pb{width:38px;text-align:center;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 0;background:#1e2b63}
.prat .n{flex:1}
.prat .v{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:18px;width:40px;text-align:center;border-radius:7px}
.v7{background:#2cb673;color:#022a16}.v6{background:#a9b83a;color:#222}.v5{background:#ff9a3c;color:#2a1000}.v8{background:#2ea6d6;color:#021a2a}.v9{background:var(--gold);color:#2a1a00}

/* END */
.endh{text-align:center;padding:22px 10px 8px}
.endh .big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(40px,11vw,68px);line-height:.95}
.endh .sub{color:var(--mut);margin-top:8px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.share{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.5}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(2,5,18,.75);backdrop-filter:blur(4px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center}}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:620px;max-height:88vh;overflow:auto;padding:16px;animation:up .25s}
@media(min-width:700px){.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;margin-bottom:8px}
.sheet p,.sheet li{line-height:1.5;color:#d3daf5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#03200f;padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;animation:up .2s}
.edlist{display:grid;gap:6px}
.edi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.edi .yy{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;color:var(--gold);width:58px}
.edi .cc{flex:1;font-weight:600}

 po:{n:"Posesión",ico:"🎯",d:"Toque y control. Necesita un medio del campo de nivel.",a:0,df:1,m:3,t:0.95},
 pa:{n:"Presión alta",ico:"🏃",d:"Asfixia al rival… pero se paga en los últimos 20 minutos.",a:2,df:0,m:2,t:1.08}
};
const LINE_W={POR:{g:1},LD:{d:.75,m:.2,a:.05},LI:{d:.75,m:.2,a:.05},DFC:{d:1},MCD:{d:.45,m:.55},MC:{d:.15,m:.7,a:.15},MCO:{m:.45,a:.55},MD:{d:.1,m:.55,a:.35},MI:{d:.1,m:.55,a:.35},ED:{m:.2,a:.8},EI:{m:.2,a:.8},DC:{a:1}};

function parseData(){
  return RAW.trim().split("\n").map((l,i)=>{
    const [season,k,coach,final,ps]=l.split("|");
    const e={id:i,season,k,club:CLUBS[k],coach,final,year:+season.slice(0,4)+1};
    e.short=CLUBS[k].n+" "+season.slice(2);
    e.players=ps.split(";").map(s=>{const [n,pos,r]=s.split(":");return {n,pos,r:+r,eid:i}});
    e.players.sort((a,b)=>POS_ORDER.indexOf(a.pos)-POS_ORDER.indexOf(b.pos)||b.r-a.r);
    let best=null;
    for(const f in FORMATIONS){ const xi=autoXI(e.players,f); const sc=xi.reduce((s,p,j)=>s+effR(p,FORMATIONS[f][j][0]),0); if(!best||sc>best.sc) best={f,xi,sc}; }
    e.formation=best.f; e.xi=best.xi; e.ovr=+(best.sc/11).toFixed(1);
    return e;
  });
}
function autoXI(players,fname){
  const slots=FORMATIONS[fname], used=new Set(), xi=Array(11).fill(null);
  for(const pass of [0,1]) for(let i=0;i<11;i++){ if(xi[i]) continue; let best=null;
    for(const p of players){ if(used.has(p.n)||fit(p.pos,slots[i][0])!==pass) continue; if(!best||p.r>best.r) best=p; }
    if(best){xi[i]=best;used.add(best.n);} }
  for(let i=0;i<11;i++){ if(xi[i]) continue; let best=null;
    for(const p of players){ if(used.has(p.n)) continue; if((slots[i][0]==="POR")!==(p.pos==="POR")) continue; if(!best||p.r>best.r) best=p; }
    if(!best) for(const p of players){ if(!used.has(p.n)&&(!best||p.r>best.r)) best=p; }
    if(best){xi[i]=best;used.add(best.n);} }
  return xi;
}
function chemistry(xi){ // química: jugadores del mismo club (distintas épocas)
  const c={}; xi.forEach(p=>{ if(p) c[p.k||EDS[p.eid].k]=(c[p.k||EDS[p.eid].k]||0)+1; });
  let b=0; const links=[]; for(const k in c) if(c[k]>1){ b+=(c[k]-1)*0.6; links.push([k,c[k]]); }
  return {bonus:Math.min(3,+b.toFixed(1)),links};
}
function teamRatings(xi,fname,chem){
  const slots=FORMATIONS[fname]; const acc={g:[0,0],d:[0,0],m:[0,0],a:[0,0]}; let sum=0;
  xi.forEach((p,i)=>{ const pos=slots[i][0]; const r=effR(p,pos); sum+=r; const w=LINE_W[pos]; for(const k in w){acc[k][0]+=w[k]*r;acc[k][1]+=w[k];} });
  const L=k=>acc[k][1]?acc[k][0]/acc[k][1]:70;
  // formaciones con pocas piezas en una línea pierden algo de solidez en ella
  const cover=k=>Math.min(1,acc[k][1]/(k==="d"?3.6:k==="m"?3:2.4));
  const r={g:L("g"),d:L("d")*(.9+.1*cover("d")),m:L("m")*(.9+.1*cover("m")),a:L("a")*(.9+.1*cover("a")),ovr:sum/11};
  for(const k of ["g","d","m","a","ovr"]) r[k]=+(r[k]+chem).toFixed(1);
  return r;
}
function makeSide(name,xi,fname,style,chem,meta){
  return {name,xi,fname,style,r:teamRatings(xi,fname,chem),meta:meta||{},chem};
}

// ---------- Simulación ----------
let RNG=Math.random;
const TUNE={c:.09,cs:50,qs:20,q0:-1.95};
const rnd=()=>RNG(); const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)); const sig=x=>1/(1+Math.exp(-x));
function wPick(items,wf){ let t=0; const ws=items.map(x=>{const w=Math.max(0,wf(x));t+=w;return w}); let r=rnd()*t; for(let i=0;i<items.length;i++){ r-=ws[i]; if(r<=0) return items[i]; } return items[items.length-1]; }
const SHOOT_W={POR:0,DFC:.7,LD:.9,LI:.9,MCD:1.1,MC:2.6,MD:3.4,MI:3.4,MCO:5.5,ED:6,EI:6,DC:10};
const ASSIST_W={POR:.05,DFC:.6,LD:2.6,LI:2.6,MCD:2,MC:4.5,MD:5,MI:5,MCO:6.5,ED:5.5,EI:5.5,DC:3};
const T={
 goal:["¡GOOOL de {s}!","¡{s} la manda a la red!","¡Golazo de {s}!","¡{s} no perdona!","¡Gol! {s} define con sangre fría.","¡{s} revienta la red!","¡Gol! Cabezazo imparable de {s}."],
 ast:[" Pase de {a}."," Asistencia de {a}."," Gran servicio de {a}."," Lo fabrica {a}."],
 save:["Paradón de {g} ante {s}.","{g} vuela y saca el disparo de {s}.","{s} prueba desde fuera… atrapa {g}.","Mano a mano de {s}: gana {g}.","{g} desvía a córner el remate de {s}."],
 miss:["{s} dispara… ¡fuera por poco!","Remate de {s} que se marcha alto.","{s} cabecea desviado.","Disparo de {s}, se va rozando el palo.","{s} la tiene, pero la manda a las nubes."],
 post:["¡AL PALO! {s} se queda a centímetros.","¡Larguero! El disparo de {s} hace temblar la portería."],
 block:["Bloquea la zaga el disparo de {s}.","Gran cruce para negar el tiro de {s}."]
};
const fill=(s,o)=>s.replace(/\{(\w)\}/g,(_,k)=>o[k]);

function lineStr(side,red,min,opp){
  const st=STYLES[side.style]; const r=side.r; let a=r.a+st.a, d=r.d+st.df, m=r.m+st.m, g=r.g;
  if(side.style==="cg" && opp.r.ovr>r.ovr) a+=Math.min(4,(opp.r.ovr-r.ovr)*.8);
  if(side.style==="po") m+=Math.max(0,(r.m-82)*.25);
  if(side.style==="pa" && min>70){ a-=3; d-=3; m-=3; }
  const pen=red*5; return {a:a-pen,d:d-pen,m:m-pen*1.2,g,t:st.t};
}
function simulateMatch(A,B,ko){
  const ev=[]; const S=[A,B]; const sc=[0,0]; const red=[0,0];
  const stats=[{sh:0,ot:0,pos:0,cor:0,yc:0,rc:0,xg:0},{sh:0,ot:0,pos:0,cor:0,yc:0,rc:0,xg:0}];
  const rat=[A.xi.map(()=>6.0+rnd()*.5),B.xi.map(()=>6.0+rnd()*.5)];
  const yel=[{}, {}], off=[new Set(),new Set()];
  const goals=[];
  const gkIdx=s=>S[s].fname?FORMATIONS[S[s].fname].findIndex(x=>x[0]==="POR"):0;
  const posOf=(s,i)=>FORMATIONS[S[s].fname][i][0];
  const active=s=>S[s].xi.map((p,i)=>i).filter(i=>!off[s].has(i));
  let mins=0;
  function minute(m,tm){
    mins++;
    const sA=lineStr(A,red[0],m,B), sB=lineStr(B,red[1],m,A); const ss=[sA,sB];
    const pA=clamp(.5+(sA.m-sB.m)/36+(A.style==="po"?.05:0)-(B.style==="po"?.05:0)+(A.style==="cg"?-.06:0)-(B.style==="cg"?-.06:0),.25,.75);
    stats[0].pos+=pA; stats[1].pos+=1-pA;
    const tempo=(sA.t+sB.t)/2*tm;
    for(const s of [0,1]){
      const o=1-s, share=s===0?pA:1-pA, me=ss[s], th=ss[o];
      const pCh=TUNE.c*tempo*Math.pow(share/.5,.8)*Math.exp((me.a-th.d-3.5)/TUNE.cs);
      if(rnd()<pCh) chance(s,m,me,th);
      if(rnd()<.02) stats[s].cor++;
    }
    // tarjetas
    for(const s of [0,1]){
      if(rnd()<.028*(S[s].style==="pa"?1.3:1)){ const act=active(s).filter(i=>posOf(s,i)!=="POR"||rnd()<.1); const i=wPick(act,j=>{const p=posOf(s,j);return p==="DFC"||p==="MCD"?3:p[0]==="L"?2:1});
        const p=S[s].xi[i]; stats[s].yc++; yel[s][i]=(yel[s][i]||0)+1; rat[s][i]-=.3;
        if(yel[s][i]>=2){ red[s]++; stats[s].rc++; off[s].add(i); rat[s][i]-=1.2; ev.push({m,t:"red",s,txt:`🟥 Segunda amarilla para ${p.n}. ${S[s].name} se queda con ${11-red[s]}.`}); }
        else ev.push({m,t:"yel",s,txt:`🟨 Amarilla para ${p.n}.`}); }
      if(rnd()<.0016){ const act=active(s).filter(i=>posOf(s,i)!=="POR"); if(act.length>7){ const i=pick(act); red[s]++; stats[s].rc++; off[s].add(i); rat[s][i]-=1.8; ev.push({m,t:"red",s,txt:`🟥 ¡Roja directa para ${S[s].xi[i].n}!`}); } }
    }
  }
  function chance(s,m,me,th){
    const o=1-s, side=S[s];
    const act=active(s); const si=wPick(act,i=>SHOOT_W[posOf(s,i)]*Math.pow(Math.max(1,effR(side.xi[i],posOf(s,i))-55)/30,2.2));
    const shooter=side.xi[si]; const sR=effR(shooter,posOf(s,si));
    const gi=gkIdx(o); const gk=S[o].xi[gi];
    stats[s].sh++;
    if(rnd()<.045){ // penalti
      const p=clamp(.78+(sR-th.g)/180,.6,.92); stats[s].ot++; stats[s].xg+=.76;
      if(rnd()<p){ sc[s]++; rat[s][si]+=1.1; rat[o][gi]-=.2; goals.push({s,m,n:shooter.n,pen:1}); ev.push({m,t:"goal",s,txt:`¡PENALTI! ${shooter.n} lo transforma.`,sc:[...sc]}); }
      else { rat[o][gi]+=.9; ev.push({m,t:"pmiss",s,txt:`¡Penalti fallado! ${gk.n} adivina y para el lanzamiento de ${shooter.n}.`}); }
      return;
    }
    const q=sig((me.a-th.d-3.5)/TUNE.qs+(sR-86)/40-(th.g-84)/35+TUNE.q0);
    stats[s].xg+=q;
    const r=rnd();
    if(r<q){
      sc[s]++; rat[s][si]+=1.15; stats[s].ot++;
      let txt=fill(pick(T.goal),{s:shooter.n}); let ast=null;
      if(rnd()<.74){ const ai=wPick(act.filter(i=>i!==si),i=>ASSIST_W[posOf(s,i)]*Math.pow(Math.max(1,effR(side.xi[i],posOf(s,i))-55)/30,2)); if(ai!==undefined){ ast=side.xi[ai]; rat[s][ai]+=.7; txt+=fill(pick(T.ast),{a:ast.n}); } }
      rat[o][gi]-=.25; FORMATIONS[S[o].fname].forEach((x,i)=>{ if(POS_GROUP[x[0]]==="d") rat[o][i]-=.15; });
      goals.push({s,m,n:shooter.n,a:ast&&ast.n}); ev.push({m,t:"goal",s,txt,sc:[...sc]});
    } else if(r<q+.36){ stats[s].ot++; rat[o][gi]+=.28; if(rnd()<.45) ev.push({m,t:"save",s,txt:fill(pick(T.save),{s:shooter.n,g:gk.n})}); }
    else if(rnd()<.07){ ev.push({m,t:"post",s,txt:fill(pick(T.post),{s:shooter.n})}); }
    else if(rnd()<.35){ ev.push({m,t:"miss",s,txt:fill(pick(r<q+.6?T.block:T.miss),{s:shooter.n})}); }
  }
  ev.push({m:0,t:"info",txt:"¡Rueda el balón! Arranca el partido."});
  for(let m=1;m<=90;m++){ minute(m,1); if(m===45) ev.push({m:45,t:"ht",txt:`Descanso. ${A.name} ${sc[0]}-${sc[1]} ${B.name}`}); }
  let et=false, pens=null;
  if(ko && sc[0]===sc[1]){ et=true; ev.push({m:90,t:"info",txt:"Final del tiempo reglamentario. ¡Habrá prórroga!"}); for(let m=91;m<=120;m++) minute(m,.85);
    if(sc[0]===sc[1]){ pens=shootout(); }
  }
  const endM=et?120:90;
  for(let i=0;i<11;i++){ rat[0][i]+=sc[0]>sc[1]?.3:sc[0]<sc[1]?-.2:0; rat[1][i]+=sc[1]>sc[0]?.3:sc[1]<sc[0]?-.2:0; }
  if(sc[1]===0) rat[0][gkIdx(0)]+=.6; if(sc[0]===0) rat[1][gkIdx(1)]+=.6;
  const R=rat.map(a=>a.map(x=>+clamp(x,3,10).toFixed(1)));
  const tot=stats[0].pos+stats[1].pos; stats[0].pos=Math.round(stats[0].pos/tot*100); stats[1].pos=100-stats[0].pos;
  let winner=sc[0]>sc[1]?0:sc[1]>sc[0]?1:null; if(pens) winner=pens.w;
  ev.sort((a,b)=>a.m-b.m);
  ev.push({m:endM,t:"end",txt:pens?`Penaltis: ${A.name} ${pens.sc[0]}-${pens.sc[1]} ${B.name}`:"¡Final del partido!"});
  function shootout(){
    const ps=[0,0]; const kicks=[]; const order=s=>active(s).filter(i=>posOf(s,i)!=="POR").sort((x,y)=>(SHOOT_W[posOf(s,y)]+effR(S[s].xi[y],posOf(s,y))/10)-(SHOOT_W[posOf(s,x)]+effR(S[s].xi[x],posOf(s,x))/10));
    const oA=order(0),oB=order(1); const ord=[oA,oB];
    ev.push({m:120,t:"info",txt:"Se mantiene el empate. ¡TANDA DE PENALTIS!"});
    for(let k=0;k<30;k++){
      const s=k%2, rd=Math.floor(k/2); const i=ord[s][rd%ord[s].length]; const p=S[s].xi[i]; const g=S[1-s].xi[gkIdx(1-s)];
      const ok=rnd()<clamp(.75+(effR(p,posOf(s,i))-g.r)/220,.6,.9); if(ok) ps[s]++;
      kicks.push({s,ok,n:p.n}); ev.push({m:120,t:"pk",s,ok,txt:`${ok?"✅":"❌"} ${p.n} ${ok?"marca":"falla"} · ${ps[0]}-${ps[1]}`});
      if(rd<5){ const aLeft=5-(rd+1), bLeft=5-(s===1?rd+1:rd);
        if(ps[0]+aLeft<ps[1]||ps[1]+bLeft<ps[0]) break; }
      else if(s===1 && ps[0]!==ps[1]) break;
    }
    return {sc:ps,w:ps[0]>ps[1]?0:1,kicks};
  }
  return {sc,pens,winner,et,ev,stats,rat:R,goals};
}
if(typeof module!=="undefined") module.exports={TUNE,parseData,autoXI,teamRatings,makeSide,simulateMatch,FORMATIONS,STYLES,chemistry,effR,fit,setRNG:f=>RNG=f};

</script>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rc=r=>r>=95?"95":r>=90?"90":r>=85?"85":r>=80?"80":r>=75?"75":"70";

function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v?Object.assign({},d,v):d}catch(e){return d}}

function shortName(n){
  n=n.replace(/\s*\(.*?\)/,"");
  if(/^(Park|Lee) /.test(n)) return n;
  const t=n.split(" "); if(t.length===1) return n;
  const parts=[t[t.length-1]]; let i=t.length-2;
  while(i>0&&/^(van|de|der|den|di|da|del|dos|von|ter|le|la|Di|De|Van|Del|Dal)$/.test(t[i])){parts.unshift(t[i]);i--;}
  return parts.join(" ");
}

function pitch(fname,xi,o={}){

    const p=xi[i]; const st=`left:${s[1]}%;top:${s[2]}%`;

    const e=EDS[p.eid], c=CLUBS[e.k]; const f=fit(p.pos,s[0]); const r=o.raw?p.r:effR(p,s[0]);
    const hide=o.blind; const cls=hide?"bgq":"bg"+rc(r);
    return `<div class="slot ${o.justPlaced===i?"new":""}" style="${st}"><div class="pc"><div class="sh ${cls}" style="border-color:${c.c1==="#ffffff"||c.c1==="#f5f5f5"?c.c2:c.c1}"><span class="pos">${s[0]}</span>${f>0&&!o.raw?`<span class="pen">${f===1?"−"+OOP_PEN:"−"+FORCED_PEN}</span>`:""}${hide?"?":r}</div><div class="nm">${esc(shortName(p.n))}</div>${o.mini?"":`<div class="ed">${esc(edTag(e))}</div>`}</div></div>`;

  <div class="hero"><div class="trophy">🏆</div>

// ---------- DRAFT ----------
function freeSlots(){ return G.xi.map((p,i)=>p?-1:i).filter(i=>i>=0); }
function canPlace(p){ const fs=freeSlots(), sl=FORMATIONS[G.formation]; return fs.filter(i=>fit(p.pos,sl[i][0])>=0); }
function usedNames(){ return new Set(G.xi.filter(Boolean).map(p=>p.n)); }
function playerState(p){ if(usedNames().has(p.n)) return "ya en tu XI"; if(!canPlace(p).length) return "sin hueco"; return ""; }
function pool(){
  const ok=EDS.filter(e=>!G.seen.has(e.id)&&OPT.eras.some((on,i)=>on&&e.year>=ERAS[i][1]&&e.year<=ERAS[i][2]));
  return ok.length?ok:EDS.filter(e=>!G.seen.has(e.id));
}
function roll(isSkip){
  if(G.rolling||!G.xi.includes(null)) return;
  if(isSkip){ if(G.skips<=0) return; G.skips--; }
  if(G.cur) G.seen.add(G.cur.id);
  G.cur=null; G.sel=null; G.rolling=true; G.freeRoll=false; rDraft();
  const P=pool(); const target=P[Math.floor(Math.random()*P.length)];
  let k=0; const el=()=>document.getElementById("roller");
  const iv=setInterval(()=>{ const e=EDS[Math.floor(Math.random()*EDS.length)]; if(el()) el().textContent=`${CLUBS[e.k].n} ${e.season}`; if(++k>12){ clearInterval(iv); G.rolling=false; G.cur=target; G.seen.add(target.id); G.freeRoll=!target.players.some(p=>!playerState(p)); rDraft(); } },70);
}
function pickPlayer(idx){
  const p=G.cur.players[idx]; if(playerState(p)) return;
  const opts=canPlace(p);
  if(opts.length===1){ place(p,opts[0]); return; }
  // si hay huecos naturales, prioriza solo esos; si no, todos los cercanos
  G.sel=(G.sel===p)?null:p; rDraft();
  if(G.sel && window.innerWidth<860){ const pt=document.querySelector(".pitch"); if(pt) pt.scrollIntoView({behavior:"smooth",block:"center"}); }
}
function place(p,i){
  G.xi[i]=p; G.picked.add(p.eid); G.cur=null; G.sel=null; G.justPlaced=i;
  if(!G.xi.includes(null)){ rDraft(); setTimeout(()=>go("review"),650); return; }
  rDraft(); G.justPlaced=-1; window.scrollTo({top:0,behavior:"smooth"});
}
function rDraft(){
  const n=G.xi.filter(Boolean).length; const sl=FORMATIONS[G.formation];
  const avg=n?(G.xi.reduce((s,p,i)=>s+(p?effR(p,sl[i][0]):0),0)/n).toFixed(1):"–";
  let hl=[]; if(G.sel) hl=canPlace(G.sel);
  let panel="";
  if(G.rolling){
    panel=`<div class="card dice-zone"><div class="dice roll">🎲</div><div class="roller disp" id="roller">…</div><div class="mut">Sorteando campeón…</div></div>`;
  } else if(!G.xi.includes(null)){
    panel=`<div class="card dice-zone"><div class="dice">✅</div><div class="disp" style="font-size:24px;font-weight:800">¡Once completo!</div></div>`;
  } else if(!G.cur){
    panel=`<div class="card dice-zone"><div class="dice">🎲</div><div class="disp" style="font-size:24px;font-weight:800">${n===0?"Sortea tu primer campeón":"Siguiente sorteo"}</div>
      <div class="mut" style="max-width:340px">Cada tirada saca un campeón de Europa al azar. Elige <b>un</b> jugador de su plantilla para un hueco libre de tu ${G.formation}.</div>
      <button class="btn pri big" data-act="roll" style="max-width:320px">🎲 Tirar dado</button></div>`;
  } else {
    const e=G.cur, c=CLUBS[e.k];
    const rows=e.players.map((p,j)=>{ const st=playerState(p); const opts=st?[]:canPlace(p); const onlyOop=!st&&opts.every(i=>fit(p.pos,sl[i][0])===1);
      return `<div class="prow ${st?"dis":""} ${G.sel===p?"sel":""}" data-act="pick" data-j="${j}"><span class="pb">${p.pos}</span><span class="n">${esc(p.n)}${st?` <span class="tag">· ${st}</span>`:onlyOop?` <span class="tag" style="color:var(--warn)">· fuera de posición (−${OOP_PEN})</span>`:""}</span><span class="rt ${G.blind?"":"r"+rc(p.r)}">${G.blind?"?":p.r}</span></div>`; }).join("");
    panel=`<div class="card draw-card"><div class="stripe" style="background:linear-gradient(90deg,${c.c1},${c.c2})"></div>
      <div class="ed-head">${crest(e.k)}<div style="min-width:0"><div class="y">${e.season} ${c.f}</div><h2>${esc(c.n)}</h2><div class="ed-meta">DT: ${esc(e.coach)} · Final: ${esc(e.final)}</div></div></div>
      ${G.sel?`<div class="hint">👆 Toca un hueco <b>dorado</b> del campo para colocar a <b>${esc(G.sel.n)}</b>.</div>`:""}
      ${G.freeRoll?`<div style="padding:0 14px 12px"><div class="banner">Ningún jugador de este campeón encaja en tus huecos libres. <b>Sorteo gratis</b>, no gasta salto.</div><button class="btn pri" style="width:100%;margin-top:8px" data-act="free">🎲 Sorteo gratis</button></div>`:""}
      <div class="plist">${rows}</div>
      <div style="padding:12px 14px;border-top:1px solid rgba(255,255,255,.06)" class="row"><button class="btn" style="flex:1" data-act="skip" ${G.skips<=0||G.freeRoll?"disabled":""}>⏭ Saltar campeón (${G.skips})</button></div>
    </div>`;
  }
  app.innerHTML=`${topbar(`<button class="btn sm ghost" data-act="quit">✕ Salir</button>`)}
  <div class="hud"><span class="chip">XI <b>${n}/11</b></span><span class="chip">Media <b>${G.blind&&n<11?"?":avg}</b></span><span class="chip">Saltos <b>${G.skips}</b></span><span class="chip">${G.formation}</span></div>
  <div class="grid2 draft"><div class="sticky">${pitch(G.formation,G.xi,{hl,sel:G.sel,justPlaced:G.justPlaced,blind:G.blind})}</div><div class="dpanel">${panel}</div></div>`;
}

// ---------- TORNEO ----------
function oppSide(e,stage){ return makeSide(e.short,e.xi,e.formation,["eq","eq","of","ca","cg","po","pa"][(e.id*7+stage)%7]||"eq",1+[0,0,0,0,.5,1,1.5][stage]); }
function oppPool(){ return EDS.filter(e=>!G.picked.has(e.id)&&!G.tour.faced.has(e.id)).sort((a,b)=>b.ovr-a.ovr); }
function drawFrom(list,a,b){ const L=list.slice(Math.min(a,list.length-1),Math.max(Math.min(b,list.length),Math.min(a,list.length-1)+1)); return L[Math.floor(Math.random()*L.length)]; }
function startTour(){
  G.name=(document.getElementById("tname")||{}).value||G.name;
  const T={stage:0,faced:new Set(),results:[],table:{},group:[],ko:[],out:false};
  G.tour=T;
  const P=oppPool(); const n=P.length;
  const o1=drawFrom(P,0,Math.round(n*.22)); T.faced.add(o1.id);
  const P2=oppPool(); const o2=drawFrom(P2,Math.round(n*.22),Math.round(n*.55)); T.faced.add(o2.id);
  const P3=oppPool(); const o3=drawFrom(P3,Math.round(n*.5),n); T.faced.add(o3.id);
  T.group=["U",o1.id,o2.id,o3.id];
  T.group.forEach(id=>T.table[id]={pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});
  T.fix=[[["U",o1.id],[o2.id,o3.id]],[["U",o2.id],[o1.id,o3.id]],[["U",o3.id],[o1.id,o2.id]]];
  REC.played++; save(REC_KEY,REC);
  go("hub");
}
function nextOpp(){
  const T=G.tour;
  if(T.stage<3) return EDS[T.fix[T.stage][0][1]];
  if(!T.ko[T.stage-3]){ const P=oppPool(); const n=P.length; const rg=[[.15,.6],[.08,.4],[.02,.22],[0,.12]][T.stage-3];
    const e=drawFrom(P,Math.round(n*rg[0]),Math.max(1,Math.round(n*rg[1]))); T.ko[T.stage-3]=e.id; T.faced.add(e.id); }
  return EDS[T.ko[T.stage-3]];
}
function tname(id){ return id==="U"?G.name:EDS[id].short; }
function applyTable(a,b,ga,gb){ const T=G.tour.table; for(const [x,gf,gc] of [[a,ga,gb],[b,gb,ga]]){ const r=T[x]; r.pj++; r.gf+=gf; r.gc+=gc; if(gf>gc){r.g++;r.pts+=3}else if(gf===gc){r.e++;r.pts++}else r.p++; } }
function standings(){ const T=G.tour; return [...T.group].sort((x,y)=>{const a=T.table[x],b=T.table[y];return b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||(x==="U"?-1:y==="U"?1:0)}); }
function tableHTML(){
  const st=standings(); const done=G.tour.stage>=3||G.tour.out;
  return `<table class="tb"><tr><th class="l">Grupo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>Pts</th></tr>${st.map((id,i)=>{const r=G.tour.table[id];return `<tr class="${id==="U"?"me":""} ${i<2?"q":""}"><td class="l"><div class="row" style="gap:7px">${id==="U"?`<span>⭐</span>`:crest(EDS[id].k,"xs")}<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px">${esc(tname(id))}</span></div></td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf-r.gc>0?"+":""}${r.gf-r.gc}</td><td><b>${r.pts}</b></td></tr>`}).join("")}</table>`;
}
function pathHTML(){ const T=G.tour; return `<div class="path">${STAGE_S.map((s,i)=>{ const r=T.results[i]; let c=""; if(r) c=r.res==="W"?"done":r.res==="D"?"drw":"lost"; else if(i===T.stage&&!T.out) c="cur"; return `<div class="${c}">${s}</div>`; }).join("")}</div>`; }
function resultsHTML(){ const T=G.tour; if(!T.results.length) return ""; return `<div class="card" style="margin-top:12px"><div class="sec-t" style="margin-top:0">Tu camino</div>${T.results.map((r,i)=>`<div class="res-l"><span class="st">${STAGE_S[i]}</span>${crest(EDS[r.opp].k,"xs")}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(EDS[r.opp].short)}</span><span class="sc ${r.res==="W"?"w":r.res==="D"?"d":"lo"}">${r.gf}-${r.ga}${r.pens?` <small>(${r.pens[0]}-${r.pens[1]}p)</small>`:""}${r.et&&!r.pens?" <small>pr.</small>":""}</span></div>`).join("")}</div>`; }
function rHub(){
  const T=G.tour; const e=nextOpp(); const U=userSide(); const O=oppSide(e,T.stage); const c=CLUBS[e.k];
  app.innerHTML=`${topbar(`<button class="btn sm ghost" data-act="quit">✕ Salir</button>`)}
  ${pathHTML()}
  <div class="grid2"><div>

      <div class="x">VS</div>

      <div class="mut" style="text-align:center;font-size:12.5px;margin-top:8px">${c.f} DT: ${esc(e.coach)} · Ganó la final: ${esc(e.final)}</div>

      <div style="margin-top:14px"><button class="btn pri big" data-act="play">▶ Jugar ${STAGES[T.stage].toLowerCase()}</button></div></div>
    ${T.stage<3||T.results.length<=3?`<div class="card" style="margin-top:12px">${tableHTML()}<div class="mut" style="font-size:12px;margin-top:8px">Los dos primeros pasan a octavos. Desempate: diferencia de goles y goles a favor.</div></div>`:""}
  </div><div>
    <div class="card"><div class="sec-t" style="margin-top:0">Ojeo: el once rival</div>${pitch(e.formation,e.xi,{mini:true})}</div>
    ${resultsHTML()}
  </div></div>`;

function compareBars(a,b){ return [["Portería","g"],["Defensa","d"],["Medio","m"],["Ataque","a"]].map(([l,k])=>{ const t=a[k]+b[k]; return `<div class="stt"><b class="r${rc(a[k])}">${a[k].toFixed(0)}</b><div><div class="lb">${l}</div><div class="bb" style="margin-top:8px"><u style="width:${a[k]/t*100}%"></u><s style="width:${b[k]/t*100}%"></s></div></div><b class="r${rc(b[k])}">${b[k].toFixed(0)}</b></div>`; }).join(""); }

// ---------- PARTIDO ----------
const SPEEDS=[["0.5×",.5],["1×",1],["2×",2],["4×",4]];
function playMatch(){
  const T=G.tour; const e=nextOpp(); const U=userSide(); const O=oppSide(e,T.stage);
  const res=simulateMatch(U,O,T.stage>=3);
  // frames: un frame por minuto + uno por penalti
  const endM=res.et?120:90; const frames=[];
  for(let m=0;m<=endM;m++) frames.push({m,ev:res.ev.filter(x=>x.m===m&&x.t!=="pk"&&x.t!=="end")});
  res.ev.filter(x=>x.t==="pk").forEach(x=>frames.push({m:endM,ev:[x],pk:1}));
  frames.push({m:endM,ev:res.ev.filter(x=>x.t==="end"),end:1});
  G.match={U,O,e,res,frames,i:0,shown:[],sc:[0,0],paused:false,speed:G.match&&G.match.speed||1,done:false};
  go("match"); tick();
}
function tick(){
  const M=G.match; if(!M||M.done||G.screen!=="match") return;
  if(M.paused){ timer=setTimeout(tick,200); return; }
  const f=M.frames[M.i++]; if(!f){ finishMatch(); return; }
  let wait=280/M.speed;
  for(const ev of f.ev){ M.shown.unshift(ev); if(ev.sc) M.sc=ev.sc; if(ev.t==="goal") wait=Math.max(wait,900/M.speed); if(ev.t==="ht") wait=1000/M.speed; if(ev.t==="pk") wait=800/M.speed; }
  M.min=f.m; updateMatch(f.ev.some(x=>x.t==="goal"));
  if(f.end){ finishMatch(); return; }
  timer=setTimeout(tick,wait);
}
function superSim(){ const M=G.match; if(!M||M.done) return; if(timer)clearTimeout(timer); while(M.i<M.frames.length){ const f=M.frames[M.i++]; for(const ev of f.ev){M.shown.unshift(ev); if(ev.sc)M.sc=ev.sc;} M.min=f.m; } finishMatch(); }
function evHTML(ev){
  const M=G.match; const mine=ev.s===0; const cls=ev.t==="goal"?("goal"+(mine?"":" opp")):(["ht","info","end"].includes(ev.t)?"big":"");
  const who=ev.s!==undefined&&!["ht","info","end"].includes(ev.t)?`<span class="who" style="background:${mine?"var(--acc)":CLUBS[M.e.k].c1};color:${mine?"#04122a":CLUBS[M.e.k].t}">${mine?"TÚ":initials(CLUBS[M.e.k].n)}</span>`:"";
  return `<div class="ev ${cls}">${cls==="big"?"":`<span class="m">${ev.t==="pk"?"⚽":ev.m+"'"}</span>`}<span>${who}${esc(ev.txt)}</span></div>`;
}
function scorersHTML(side){ const M=G.match; const k=M.shown.filter(x=>x.t==="goal"&&x.s===side).length; return M.res.goals.filter(g=>g.s===side).slice(0,k).map(g=>`⚽ ${esc(shortName(g.n))} ${g.m}'${g.pen?" (p)":""}`).join("<br>"); }
function rMatch(){
  const M=G.match; const c=CLUBS[M.e.k];
  app.innerHTML=`${topbar(`<span class="chip">${STAGES[G.tour.stage]}</span>`)}
  <div class="card" style="padding:0;overflow:hidden"><div class="stripe" style="background:linear-gradient(90deg,var(--acc),var(--acc2) 50%,${c.c1} 50%,${c.c2})"></div>
    <div class="score"><div class="tm">⭐<br>${esc(G.name)}</div><div class="num"><span id="s0">0</span><span style="color:var(--mut);font-size:.6em">-</span><span id="s1">0</span></div><div class="tm"><div style="display:flex;justify-content:center;margin-bottom:4px">${crest(M.e.k,"sm")}</div>${esc(c.n)}<br><span style="color:var(--gold);font-size:.8em">${M.e.season}</span></div></div>
    <div class="scorers"><div id="sc0"></div><div id="sc1"></div></div>
    <div style="padding:0 14px 12px"><div class="clock" id="clk">0'</div><div class="prog"><u id="prg" style="width:0"></u></div></div>
  </div>
  <div class="speed" id="spd"></div>
  <div class="grid2"><div class="feed" id="feed"></div><div id="post"></div></div>`;
  updateMatch(false);
}
function updateMatch(goalFlash){
  const M=G.match; if(!document.getElementById("feed")) return;
  const s0=document.getElementById("s0"), s1=document.getElementById("s1");
  if(s0.textContent!=String(M.sc[0])){ s0.textContent=M.sc[0]; if(goalFlash){s0.classList.remove("flash");void s0.offsetWidth;s0.classList.add("flash");} }
  if(s1.textContent!=String(M.sc[1])){ s1.textContent=M.sc[1]; if(goalFlash){s1.classList.remove("flash");void s1.offsetWidth;s1.classList.add("flash");} }
  const endM=M.res.et?120:90;
  const pk=M.shown.filter(x=>x.t==="pk").length;
  document.getElementById("clk").textContent=M.done?(M.res.pens?`Final · penaltis ${M.res.pens.sc[0]}-${M.res.pens.sc[1]}`:M.res.et?"Final · prórroga":"Final"):pk?`Penaltis ${pk}`:(M.min||0)+"'";
  document.getElementById("prg").style.width=Math.min(100,(M.min||0)/endM*100)+"%";
  document.getElementById("sc0").innerHTML=scorersHTML(0); document.getElementById("sc1").innerHTML=scorersHTML(1);
  const fd=document.getElementById("feed"); const had=+(fd.dataset.n||0); const diff=M.shown.length-had;
  if(diff>0){ fd.insertAdjacentHTML("afterbegin",M.shown.slice(0,diff).map(evHTML).join("")); fd.dataset.n=M.shown.length; }
  document.getElementById("spd").innerHTML=M.done?"":`<button data-act="pause" class="${M.paused?"on":""}">${M.paused?"▶ Seguir":"⏸ Pausa"}</button>${SPEEDS.map(([l,v])=>`<button data-act="speed" data-v="${v}" class="${M.speed===v&&!M.paused?"on":""}">${l}</button>`).join("")}<button class="super" data-act="super">SUPER ⏭</button>`;
}
function finishMatch(){
  const M=G.match; if(M.done) return; M.done=true; if(timer){clearTimeout(timer);timer=null;}
  const T=G.tour, r=M.res; const gf=r.sc[0], ga=r.sc[1];
  let res=r.winner===0?"W":r.winner===1?"L":"D";
  T.results[T.stage]={opp:M.e.id,gf,ga,res,pens:r.pens?r.pens.sc:null,et:r.et,pw:!!r.pens,rat:r.rat[0],goals:r.goals.filter(g=>g.s===0)};
  if(T.stage<3){ const fx=T.fix[T.stage]; applyTable("U",fx[0][1],gf,ga);
    const [a,b]=fx[1]; const ea=EDS[a],eb=EDS[b]; const rr=simulateMatch(oppSide(ea,T.stage),oppSide(eb,T.stage),false); applyTable(a,b,rr.sc[0],rr.sc[1]); M.other={a,b,sc:rr.sc}; }
  updateMatch(false);
  document.getElementById("post").innerHTML=postHTML();
}
function postHTML(){
  const M=G.match, r=M.res, T=G.tour; const st=r.stats; const sl=FORMATIONS[G.formation];
  const mvpI=r.rat[0].indexOf(Math.max(...r.rat[0]));
  const row=(l,a,b,fmt=x=>x)=>{const t=(+a)+(+b)||1;return `<div class="stt"><b>${fmt(a)}</b><div><div class="lb">${l}</div><div class="bb" style="margin-top:8px"><u style="width:${a/t*100}%"></u><s style="width:${b/t*100}%"></s></div></div><b>${fmt(b)}</b></div>`};
  let next="";
  const res=T.results[T.stage];
  if(T.stage<3){ next=`<div class="mut" style="font-size:13px;margin:8px 0">Otro partido del grupo: ${esc(EDS[M.other.a].short)} ${M.other.sc[0]}-${M.other.sc[1]} ${esc(EDS[M.other.b].short)}</div>`; }
  const verdict=res.res==="W"?(T.stage===6?"🏆 ¡CAMPEONES DE EUROPA!":"✅ Victoria"):res.res==="D"?"🟨 Empate":(T.stage>=3?"❌ Eliminado":"❌ Derrota");
  return `<div class="card"><div class="disp" style="font-size:26px;font-weight:800;text-align:center">${verdict}</div>
    ${next}
    ${row("Posesión %",st[0].pos,st[1].pos)}${row("Tiros",st[0].sh,st[1].sh)}${row("A puerta",st[0].ot,st[1].ot)}${row("xG",st[0].xg.toFixed(1),st[1].xg.toFixed(1))}${row("Córners",st[0].cor,st[1].cor)}${row("Tarjetas",st[0].yc+st[0].rc,st[1].yc+st[1].rc)}
    <div class="sec-t">Notas de tu once</div>
    ${G.xi.map((p,i)=>`<div class="prat"><span class="pb">${sl[i][0]}</span><span class="n">${esc(p.n)}${i===mvpI?" ⭐ <b style='color:var(--gold)'>MVP</b>":""}</span><span class="v ${vc(r.rat[0][i])}">${r.rat[0][i].toFixed(1)}</span></div>`).join("")}
    <div style="margin-top:14px"><button class="btn pri big" data-act="cont">Continuar ➜</button></div></div>`;
}
function afterMatch(){
  const T=G.tour; const res=T.results[T.stage];
  if(T.stage<3){
    if(T.stage===2){ const st=standings(); if(st.indexOf("U")>1){ T.out=true; return endTour(); } }
    T.stage++; return go("hub");
  }
  if(res.res!=="W"){ T.out=true; return endTour(); }
  if(T.stage===6) return endTour();
  T.stage++; go("hub");
}

// ---------- FIN ----------
function endTour(){
  const T=G.tour; const won=!T.out&&T.results[6]&&T.results[6].res==="W";
  const all=T.results.filter(Boolean); const ga=all.reduce((s,r)=>s+r.ga,0);
  const perfect=won&&all.length===7&&all.every(r=>r.res==="W"&&!r.pw)&&ga===0;
  const unbeaten=won&&all.every(r=>r.res!=="L");
  const reached=all.length-1+(won?1:0);
  if(won) REC.titles++; if(perfect) REC.perfect++;
  REC.best=Math.max(REC.best,reached); const ov=userSide().r.ovr; if(won) REC.bestOvr=Math.max(REC.bestOvr||0,ov);
  save(REC_KEY,REC);
  G.end={won,perfect,unbeaten,reached};
  go("end");
}
function endTitle(){
  const E=G.end,T=G.tour;
  if(E.perfect) return ["¡7 A 0!","Siete victorias y la portería a cero. Leyenda absoluta.","🏆✨"];
  if(E.won&&E.unbeaten) return ["CAMPEÓN INVICTO","Copa de Europa sin perder un solo partido.","🏆"];
  if(E.won) return ["¡CAMPEÓN DE EUROPA!","La Orejona es tuya.","🏆"];
  const last=T.results.filter(Boolean).length-1;
  if(last===6) return ["SUBCAMPEÓN","Tan cerca… El sueño termina en la final.","🥈"];
  if(last<=2) return ["ELIMINADO EN EL GRUPO","El sueño termina aquí.","💔"];
  return ["ELIMINADO EN "+STAGES[last].toUpperCase(),"El sueño termina aquí.","💔"];
}
function tourStats(){
  const T=G.tour; const all=T.results.filter(Boolean); const gs={}; const ast={}; const rs=G.xi.map(()=>[]);
  all.forEach(r=>{ r.goals.forEach(g=>{gs[g.n]=(gs[g.n]||0)+1; if(g.a) ast[g.a]=(ast[g.a]||0)+1;}); r.rat.forEach((v,i)=>rs[i].push(v)); });
  const top=Object.entries(gs).sort((a,b)=>b[1]-a[1])[0]; const ta=Object.entries(ast).sort((a,b)=>b[1]-a[1])[0];
  const avg=rs.map(a=>a.reduce((s,x)=>s+x,0)/a.length); const mi=avg.indexOf(Math.max(...avg));
  return {gf:all.reduce((s,r)=>s+r.gf,0),ga:all.reduce((s,r)=>s+r.ga,0),top,ta,mvp:G.xi[mi],mvpv:avg[mi]};
}
function shareText(){
  const [t]=endTitle(); const T=G.tour; const s=tourStats();
  const icons=STAGE_S.map((x,i)=>{const r=T.results[i]; if(!r) return "⬛"; if(r.res==="W") return r.pw?"🎯":"✅"; if(r.res==="D") return "🟨"; return "❌";});
  return `CLUBS XI ⚽ Copa de Europa histórica\n${G.end.won?"🏆":"💔"} ${t}\n${icons.slice(0,3).join("")} ${icons.slice(3).join("")}\n${G.formation} · Valoración ${userSide().r.ovr.toFixed(1)}${G.blind?" · a ciegas":""}\nGoles ${s.gf}-${s.ga}${s.top?` · Pichichi: ${shortName(s.top[0])} (${s.top[1]})`:""}\n⭐ MVP: ${s.mvp.n}\nclubs-xi-champions.pages.dev`;
}
function rEnd(){
  const [t,sub,ico]=endTitle(); const s=tourStats();
  app.innerHTML=`${topbar()}
  <div class="endh"><div style="font-size:64px">${ico}</div><div class="big" style="${G.end.won?"color:var(--gold)":""}">${t}</div><div class="sub">${sub}</div></div>
  ${pathHTML()}
  <div class="grid2"><div>
    <div class="card"><div class="stats3" style="margin-top:0"><div class="stat"><b>${s.gf}</b><span>goles a favor</span></div><div class="stat"><b>${s.ga}</b><span>goles en contra</span></div><div class="stat"><b>${userSide().r.ovr.toFixed(1)}</b><span>valoración</span></div></div>
      <div style="margin-top:12px;font-size:14px;line-height:1.7">⭐ <b>MVP:</b> ${esc(s.mvp.n)} <span class="mut">(${s.mvpv.toFixed(2)})</span>${s.top?`<br>⚽ <b>Pichichi:</b> ${esc(s.top[0])} <span class="mut">(${s.top[1]})</span>`:""}${s.ta?`<br>🅰️ <b>Asistente:</b> ${esc(s.ta[0])} <span class="mut">(${s.ta[1]})</span>`:""}</div></div>
    ${resultsHTML()}
    <div class="card" style="margin-top:12px"><div class="sec-t" style="margin-top:0">Comparte tu resultado</div><div class="share" id="shr">${esc(shareText())}</div>
      <div class="row" style="margin-top:10px"><button class="btn" style="flex:1" data-act="copy">📋 Copiar</button><button class="btn pri" style="flex:1" data-act="again">🎲 Nueva partida</button></div></div>
  </div><div>${pitch(G.formation,G.xi,{})}</div></div>`;
  if(G.end.won) confetti();
}
function confetti(){ const d=document.createElement("div"); d.className="confetti"; const cols=["#f3c95b","#4fd6ff","#7c5cff","#fff","#3ee08f"]; for(let i=0;i<90;i++){ const c=document.createElement("i"); c.style.left=Math.random()*100+"%"; c.style.background=cols[i%cols.length]; c.style.animationDuration=(2.2+Math.random()*2.5)+"s"; c.style.animationDelay=Math.random()*1.2+"s"; d.appendChild(c);} document.body.appendChild(d); setTimeout(()=>d.remove(),6500); }

// ---------- PLANTILLAS ----------
let SQF="";
function rSquads(){
  G=null; window.scrollTo({top:0});
  const list=EDS.filter(e=>!SQF||e.k===SQF).slice().reverse();
  const clubs=[...new Set(EDS.map(e=>e.k))].map(k=>[k,EDS.filter(e=>e.k===k).length]).sort((a,b)=>b[1]-a[1]);
  app.innerHTML=`${topbar(`<button class="btn sm" data-act="home">← Inicio</button>`)}
  <h2 class="disp" style="font-size:30px">Los ${EDS.length} campeones de Europa</h2><p class="mut" style="margin-top:4px">Toca un campeón para ver su plantilla completa.</p>
  <div class="row wrap" style="gap:6px;margin:12px 0"><button class="chip ${!SQF?"on":""}" data-act="sqf" data-v="">Todos</button>${clubs.map(([k,n])=>`<button class="chip ${SQF===k?"on":""}" data-act="sqf" data-v="${k}">${esc(CLUBS[k].n)} ${n}</button>`).join("")}</div>
  <div class="edlist">${list.map(e=>`<button class="edi" data-act="sq" data-id="${e.id}"><span class="yy">${e.season}</span>${crest(e.k,"sm")}<span class="cc">${esc(CLUBS[e.k].n)}<br><span class="mut" style="font-size:12px;font-weight:500">${esc(e.final)}</span></span><span class="rt r${rc(e.ovr)}" style="font-size:22px">${e.ovr.toFixed(0)}</span></button>`).join("")}</div>`;
}
function squadModal(id){
  const e=EDS[id], c=CLUBS[e.k];
  modal(`<div class="row">${crest(e.k)}<div><div style="color:var(--gold);font-weight:700" class="disp">${e.season} ${c.f}</div><h3 style="margin:0">${esc(c.n)}</h3><div class="mut" style="font-size:13px">DT: ${esc(e.coach)} · Final: ${esc(e.final)}</div></div></div>
  <div class="sec-t">Once tipo (${e.formation}) · ${e.ovr.toFixed(1)}</div>${pitch(e.formation,e.xi,{mini:true})}
  <div class="sec-t">Plantilla (${e.players.length})</div>${e.players.map(p=>`<div class="prat"><span class="pb">${p.pos}</span><span class="n">${esc(p.n)}</span><span class="rt r${rc(p.r)}" style="font-size:20px">${p.r}</span></div>`).join("")}
  <button class="btn" style="width:100%;margin-top:14px" data-act="close">Cerrar</button>`);
}
function howModal(){
  modal(`<h3>Cómo jugar</h3><ol style="padding-left:18px;margin:0">
  <li><b>Elige formación y estilo.</b> El estilo puedes cambiarlo antes de cada partido.</li>
  <li><b>Tira el dado.</b> Sale un campeón de Europa al azar (1956–2026). Ficha <b>un</b> jugador de su plantilla y colócalo en un hueco libre compatible.</li>
  <li><b>Posiciones.</b> En su posición natural rinde al 100%. En una posición cercana (lateral↔central, interior↔extremo…) pierde ${OOP_PEN} puntos.</li>
  <li><b>3 saltos.</b> Si no te gusta el campeón, sáltalo. Si ningún jugador encaja en tus huecos, el sorteo es gratis.</li>
  <li><b>Sin repetir.</b> Cada campeón sale una sola vez, y el mismo jugador no puede estar dos veces en tu once (aunque haya ganado varias Copas).</li>
  <li><b>Química.</b> Jugadores del mismo club en distintas épocas suman química a todo el equipo.</li>
  <li><b>La Copa.</b> Fase de grupos (3 partidos, pasan 2) y eliminatorias a partido único con prórroga y penaltis: octavos, cuartos, semis y final.</li>
  <li><b>El reto:</b> el <b>7 a 0</b>, siete victorias sin encajar ni un gol.</li></ol>
  <button class="btn pri" style="width:100%;margin-top:14px" data-act="close">¡Entendido!</button>`);
}
function recModal(){
  modal(`<h3>Tus récords</h3><div class="stats3"><div class="stat"><b>${REC.played}</b><span>partidas</span></div><div class="stat"><b>${REC.titles}</b><span>Copas</span></div><div class="stat"><b>${REC.perfect}</b><span>7 a 0</span></div></div>
  <p class="mut" style="margin-top:12px">Mejor ronda alcanzada: <b style="color:var(--tx)">${REC.best<0?"—":REC.best>=7?"Campeón":STAGES[REC.best]}</b>${REC.bestOvr?`<br>Mejor once campeón: <b style="color:var(--tx)">${REC.bestOvr.toFixed(1)}</b>`:""}</p>
  <p class="mut" style="font-size:12px">Los récords se guardan solo en este navegador.</p>
  <button class="btn" style="width:100%;margin-top:6px" data-act="close">Cerrar</button>`);
}
function quitModal(){ modal(`<h3>¿Abandonar la partida?</h3><p>Perderás el once y el progreso de esta Copa.</p><div class="row"><button class="btn" style="flex:1" data-act="close">Seguir jugando</button><button class="btn pri" style="flex:1" data-act="home">Abandonar</button></div>`); }

// ---------- EVENTOS ----------
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  switch(a){
    case "start": newGame(); break;
    case "form": OPT.formation=b.dataset.v; save(OPT_KEY,OPT); rHome(); break;
    case "style": if(G&&G.screen&&G.screen!=="home"){ G.style=b.dataset.v; render(); } else { OPT.style=b.dataset.v; save(OPT_KEY,OPT); rHome(); } break;
    case "era": { const i=+b.dataset.i; OPT.eras[i]=!OPT.eras[i]; if(!OPT.eras.some(Boolean)) OPT.eras[i]=true; save(OPT_KEY,OPT); rHome(); break; }
    case "blind": OPT.blind=!OPT.blind; save(OPT_KEY,OPT); rHome(); break;
    case "roll": roll(false); break;
    case "free": roll(false); break;
    case "skip": roll(true); break;
    case "pick": pickPlayer(+b.dataset.j); break;
    case "place": if(G.sel) place(G.sel,+b.dataset.i); break;
    case "begin": OPT.style=G.style; save(OPT_KEY,OPT); startTour(); break;
    case "play": playMatch(); break;
    case "pause": G.match.paused=!G.match.paused; updateMatch(false); break;
    case "speed": G.match.speed=+b.dataset.v; G.match.paused=false; if(timer){clearTimeout(timer);} timer=setTimeout(tick,60); updateMatch(false); break;
    case "super": superSim(); break;
    case "cont": afterMatch(); break;
    case "copy": { const t=shareText(); const ok=()=>toast("¡Copiado!"); const fb=()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById("shr")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); try{document.execCommand("copy");ok();}catch(e){toast("Selecciona y copia el texto");} };
      try{ navigator.clipboard.writeText(t).then(ok,fb); }catch(e){ fb(); } break; }
    case "again": newGame(); break;
    case "home": closeModal(); if(timer){clearTimeout(timer);timer=null;} G=null; window.scrollTo({top:0}); rHome(); break;
    case "quit": quitModal(); break;
    case "close": closeModal(); break;
    case "how": howModal(); break;
    case "recs": recModal(); break;
    case "squads": rSquads(); break;
    case "sqf": SQF=b.dataset.v; rSquads(); break;
    case "sq": squadModal(+b.dataset.id); break;
  }
});
rHome();

</script>
